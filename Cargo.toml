[package]
name = "nofetch"
version = "0.1.2"
edition = "2024"
description = "fastfetch-based program written in rust with #![no_std]"
license = "MIT"
authors = ["maslina524 <luk.kirill2804@gmail.com>"]
repository = "https://github.com/maslina524/nofetch"
readme = "README.md"
categories = ["no-std", "command-line-utilities"]
keywords = [
    "rust", "fastfetch", "system-info", "cli", "no-std",
    "embedded", "windows", "terminal", "fetch", "no-dependencies"
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
chrono = "0.4.45"
zlib-rs = "0.6.7"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }